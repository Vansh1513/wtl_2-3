<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventZone | Contact</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chatbot.css">
</head>
<body>

<header>
  <div class="logo">EventZone</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a class="btn" href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<div class="form-container">
  <h2>Contact Us</h2>

  <form onsubmit="return contactMessage()">
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea placeholder="Write your message..." required></textarea>
    </div>

    <button class="btn" type="submit" style="width:100%; border:none; cursor:pointer;">
      Send Message
    </button>
  </form>
</div>

<footer>
  <p>© EventZone | Contact Page</p>
</footer>

<script src="script.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
