<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventZone | Booking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chatbot.css">
</head>
<body>

<header>
  <div class="logo">EventZone</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a class="btn" href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<div class="form-container">
  <h2>Book Tickets</h2>

  <form onsubmit="return confirmBooking()">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" placeholder="Enter your phone number" required>
    </div>

    <div class="form-group">
      <label>Select Tickets</label>
      <select id="ticketCount" onchange="calculateTotal()" required>
        <option value="">Choose</option>
        <option value="499">1 Ticket - ₹499</option>
        <option value="998">2 Tickets - ₹998</option>
        <option value="1497">3 Tickets - ₹1497</option>
        <option value="1996">4 Tickets - ₹1996</option>
      </select>
    </div>

    <h3 id="totalPrice" style="text-align:center; margin-bottom: 15px;">
      Total: ₹0
    </h3>

    <div class="form-group">
      <label>Payment Mode</label>
      <select required>
        <option value="">Select</option>
        <option>UPI</option>
        <option>Debit Card</option>
        <option>Credit Card</option>
        <option>Cash at Venue</option>
      </select>
    </div>

    <button class="btn" type="submit" style="width:100%; border:none; cursor:pointer;">
      Confirm Booking
    </button>
  </form>
</div>

<footer>
  <p>© 2026 EventZone | Booking Page</p>
</footer>

<script src="script.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
