<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventZone | Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chatbot.css">
</head>
<body>

<header>
  <div class="logo">EventZone</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="signup.html">Signup</a></li>
    </ul>
  </nav>
</header>

<div class="form-container">
  <h2>Login</h2>

  <form onsubmit="return validateLogin()">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" required>
    </div>

    <button class="btn" type="submit" style="width:100%; border:none; cursor:pointer;">
      Login
    </button>
  </form>

  <p>New user? <a href="signup.html">Create Account</a></p>
</div>

<footer>
  <p>© 2026 EventZone | Login Page</p>
</footer>

<script src="script.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
